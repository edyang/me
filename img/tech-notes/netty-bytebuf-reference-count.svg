<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Netty 研究：ByteBuf 的引用计数与跨线程传递</title>
<desc id="desc">入站缓冲：先确定自动释放规则；跨线程保留：为异步使用增加有效引用；业务完成：所有退出路径负责释放；内存观察：同时关注堆与直接内存</desc>
