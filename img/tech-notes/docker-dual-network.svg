<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">双网络承担不同通信路径</title><desc id="desc">独立 IP、服务名通信和宿主机访问，分别验证</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376485"/></marker></defs><rect width="960" height="540" rx="12" fill="#fff"/><g font-family="system-ui,-apple-system,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="48" y="62" font-size="30" font-weight="700" fill="#22374a">双网络承担不同通信路径</text><text x="48" y="96" font-size="16" fill="#64798d">独立 IP、服务名通信和宿主机访问，分别验证</text><rect x="55" y="180" width="240" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="175.0" y="216" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">容器</text><text x="175.0" y="246" text-anchor="middle" font-size="16" fill="#62788d">两个网络接口</text><rect x="355" y="135" width="235" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="472.5" y="171" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">bridge</text><text x="472.5" y="201" text-anchor="middle" font-size="16" fill="#62788d">内部服务名通信</text><rect x="355" y="310" width="235" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="472.5" y="346" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">macvlan</text><text x="472.5" y="376" text-anchor="middle" font-size="16" fill="#62788d">局域网独立地址</text><rect x="650" y="135" width="250" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="775.0" y="171" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">内部服务</text><text x="775.0" y="201" text-anchor="middle" font-size="16" fill="#62788d">MQTT / 数据库等</text><rect x="650" y="310" width="250" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="775.0" y="346" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">物理网络</text><text x="775.0" y="376" text-anchor="middle" font-size="16" fill="#62788d">交换机 / 外部目标</text><path d="M295 205L355 185" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M295 255L355 360" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M590 185L650 185" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M590 360L650 360" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="60" y="450" font-size="18" fill="#536c82">宿主机自身访问需单独检查路由与 macvlan 的隔离条件</text><text x="48" y="510" font-size="14" fill="#758799">通用原理示意 · 不含现场拓扑与生产参数</text></g></svg>
