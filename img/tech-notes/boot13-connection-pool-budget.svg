<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot 性能：连接池大不等于数据库更快</title>
<desc id="desc">入口请求：形成连接需求；连接借用：容量有限并可排队；数据库执行：受查询锁和资源限制；及时归还：异常路径同样释放资源</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3977b7"/></marker></defs>
<rect width="1120" height="660" rx="18" fill="#f4f7fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="44" y="58" font-size="24" fill="#123555">Spring Boot 性能：连接池大不等于数据库更快</text>
<text x="44" y="91" font-size="17" fill="#54718b">关系示意 · 箭头表示处理或依赖方向</text>
<rect x="44" y="132" width="470" height="142" rx="12" fill="white" stroke="#bdd0e2" stroke-width="2"/>
<circle cx="74" cy="167" r="15" fill="#2769a4"/>
<text x="69" y="173" font-size="17" fill="white">1</text>
<text x="101" y="175" font-size="22" fill="#143f64">入口请求</text>
<text x="68" y="223" font-size="17" fill="#3c5d7a">形成连接需求</text>
<rect x="606" y="132" width="470" height="142" rx="12" fill="white" stroke="#bdd0e2" stroke-width="2"/>
<circle cx="636" cy="167" r="15" fill="#2769a4"/>
<text x="631" y="173" font-size="17" fill="white">2</text>
<text x="663" y="175" font-size="22" fill="#143f64">连接借用</text>
<text x="630" y="223" font-size="17" fill="#3c5d7a">容量有限并可排队</text>
<rect x="606" y="332" width="470" height="142" rx="12" fill="white" stroke="#bdd0e2" stroke-width="2"/>
<circle cx="636" cy="367" r="15" fill="#2769a4"/>
<text x="631" y="373" font-size="17" fill="white">3</text>
<text x="663" y="375" font-size="22" fill="#143f64">数据库执行</text>
<text x="630" y="423" font-size="17" fill="#3c5d7a">受查询锁和资源限制</text>
<rect x="44" y="332" width="470" height="142" rx="12" fill="white" stroke="#bdd0e2" stroke-width="2"/>
<circle cx="74" cy="367" r="15" fill="#2769a4"/>
<text x="69" y="373" font-size="17" fill="white">4</text>
<text x="101" y="375" font-size="22" fill="#143f64">及时归还</text>
<text x="68" y="423" font-size="17" fill="#3c5d7a">异常路径同样释放资源</text>
<g fill="none" stroke="#3977b7" stroke-width="3" marker-end="url(#arrow)">
<path d="M516 203 H600"/>
<path d="M841 276 V326"/>
<path d="M603 403 H520"/>
