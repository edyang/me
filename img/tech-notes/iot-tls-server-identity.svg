<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">物联网安全研究：TLS 加密还需要验证对端身份</title>
<desc id="desc">网络连接：只证明路径可达；证书链：核对可信签发与有效期；主机身份：匹配实际访问的服务名；应用认证：验证后再提交设备凭据</desc>
