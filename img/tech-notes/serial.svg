<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">串口访问的两个独立层次</title><desc id="desc">宿主机识别成功后，仍需检查容器映射与运行用户</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376485"/></marker></defs><rect width="960" height="540" rx="12" fill="#fff"/><g font-family="system-ui,-apple-system,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="48" y="62" font-size="30" font-weight="700" fill="#22374a">串口访问的两个独立层次</text><text x="48" y="96" font-size="16" fill="#64798d">宿主机识别成功后，仍需检查容器映射与运行用户</text><rect x="60" y="170" width="235" height="105" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="177.5" y="206" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">USB 设备</text><text x="177.5" y="236" text-anchor="middle" font-size="16" fill="#62788d">枚举 / 驱动 / 稳定路径</text><rect x="360" y="170" width="235" height="105" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="477.5" y="206" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">宿主机</text><text x="477.5" y="236" text-anchor="middle" font-size="16" fill="#62788d">设备节点与权限</text><rect x="660" y="170" width="235" height="105" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="777.5" y="206" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">容器与应用</text><text x="777.5" y="236" text-anchor="middle" font-size="16" fill="#62788d">映射 / 用户 / 协议</text><path d="M295 220L360 220" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M595 220L660 220" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="70" y="380" font-size="20" fill="#244d6d">先验证 USB 与设备节点，再验证容器中的打开和回包</text><text x="48" y="510" font-size="14" fill="#758799">通用原理示意 · 不含现场拓扑与生产参数</text></g></svg>
