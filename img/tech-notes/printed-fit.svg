<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">卡件配合分成三个检查动作</title><desc id="desc">插入、旋转和锁紧，分别评价间隙与接触</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376485"/></marker></defs><rect width="960" height="540" rx="12" fill="#fff"/><g font-family="system-ui,-apple-system,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="48" y="62" font-size="30" font-weight="700" fill="#22374a">卡件配合分成三个检查动作</text><text x="48" y="96" font-size="16" fill="#64798d">插入、旋转和锁紧，分别评价间隙与接触</text><rect x="50" y="190" width="260" height="115" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="180.0" y="226" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">插入</text><text x="180.0" y="256" text-anchor="middle" font-size="16" fill="#62788d">检查槽口通过尺寸</text><rect x="350" y="190" width="260" height="115" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="480.0" y="226" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">旋转</text><text x="480.0" y="256" text-anchor="middle" font-size="16" fill="#62788d">检查扫掠空间与颈部间隙</text><rect x="650" y="190" width="260" height="115" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="780.0" y="226" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">锁紧</text><text x="780.0" y="256" text-anchor="middle" font-size="16" fill="#62788d">检查接触与承载</text><path d="M310 245L350 245" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M610 245L650 245" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="125" y="370" width="710" height="78" rx="10" fill="#f2f6fb"/><text x="480" y="416" text-anchor="middle" font-size="21" fill="#244d6d">每次只改一个主要尺寸，并记录打印条件与试装结果</text><text x="48" y="510" font-size="14" fill="#758799">通用原理示意 · 不含现场拓扑与生产参数</text></g></svg>
