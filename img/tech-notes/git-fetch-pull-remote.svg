<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">研究 Git：fetch、pull 与远端跟踪分支</title>
<desc id="desc">远端仓库：保存共享提交；获取对象：fetch 更新本地认知；跟踪引用：与本地分支分别存在；显式整合：比较后选择合并方式</desc>
