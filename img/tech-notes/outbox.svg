<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">离线队列中的领取与重试</title><desc id="desc">状态变化、时间和幂等结果需要共同记录</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376485"/></marker></defs><rect width="960" height="540" rx="12" fill="#fff"/><g font-family="system-ui,-apple-system,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="48" y="62" font-size="30" font-weight="700" fill="#22374a">离线队列中的领取与重试</text><text x="48" y="96" font-size="16" fill="#64798d">状态变化、时间和幂等结果需要共同记录</text><rect x="50" y="165" width="240" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="170.0" y="201" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">等待任务</text><text x="170.0" y="231" text-anchor="middle" font-size="16" fill="#62788d">到达 next_retry_at</text><rect x="355" y="165" width="245" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="477.5" y="201" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">领取并上传</text><text x="477.5" y="231" text-anchor="middle" font-size="16" fill="#62788d">租约 / 连接超时</text><rect x="660" y="165" width="245" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="782.5" y="201" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">成功确认</text><text x="782.5" y="231" text-anchor="middle" font-size="16" fill="#62788d">保留索引，按策略清理</text><rect x="355" y="350" width="245" height="100" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="477.5" y="386" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">失败后退避</text><text x="477.5" y="416" text-anchor="middle" font-size="16" fill="#62788d">累计次数，安排下次时间</text><path d="M290 215L355 215" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600 215L660 215" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M477 265L477 350" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M355 400H165V275" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="65" y="465" font-size="17" fill="#62788d">进程中断需要回收任务；未知回执先查询再重试</text><text x="48" y="510" font-size="14" fill="#758799">通用原理示意 · 不含现场拓扑与生产参数</text></g></svg>
