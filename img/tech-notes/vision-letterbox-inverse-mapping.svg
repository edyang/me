<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">视觉几何：等比例缩放补边后的框怎样还原</title>
<desc id="desc">原始几何：记录宽高与已知标尺；缩放补边：保存真实比例和偏移；模型输出：坐标属于处理图基准；逆向映射：先减偏移再按比例还原</desc>
