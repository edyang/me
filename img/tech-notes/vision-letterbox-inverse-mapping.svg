<circle cx="74" cy="367" r="15" fill="#2769a4"/>
<text x="69" y="373" font-size="17" fill="white">4</text>
<text x="101" y="375" font-size="22" fill="#143f64">逆向映射</text>
<text x="68" y="423" font-size="17" fill="#3c5d7a">先减偏移再按比例还原</text>
