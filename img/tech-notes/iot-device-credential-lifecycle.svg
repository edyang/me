<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">物联网设备身份：批量共用一个密码的问题</title>
<desc id="desc">设备登记：稳定身份与业务归属分开；独立凭据：限制单设备泄露影响范围；权限校验：服务端控制主题和动作；轮换退役：验证切换并撤销旧访问</desc>
