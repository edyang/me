<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Web与Redis的容器通信和数据持久化架构"><title>Web、Redis 与数据卷架构</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f648c"/></marker></defs><rect width="1000" height="620" rx="18" fill="#f5f8fb"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1d3852"><text x="36" y="43" font-size="24" font-weight="700">应用通信与数据存储</text><rect x="36" y="72" width="270" height="105" rx="10" fill="white" stroke="#b7cadb"/><text x="60" y="110" font-size="22">本机浏览器 / 反向代理</text><text x="60" y="145" font-size="18">127.0.0.1:8080</text><rect x="346" y="72" width="612" height="105" rx="10" fill="white" stroke="#b7cadb"/><text x="372" y="110" font-size="22">Linux 宿主机端口映射</text><text x="372" y="145" font-size="18">宿主机 8080 → Web 容器 8000</text><path d="M306 124H334" stroke="#2f648c" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="220" width="922" height="226" rx="12" fill="#eaf1f7" stroke="#b7cadb" stroke-dasharray="7 5"/><text x="58" y="251" font-size="19">app_net · 用户自定义 bridge 网络</text><rect x="58" y="278" width="356" height="130" rx="10" fill="white" stroke="#a4bbce"/><text x="82" y="317" font-size="23" font-weight="700">web</text><text x="82" y="351" font-size="18">Gunicorn + Python WSGI</text><text x="82" y="383" font-size="18">监听 0.0.0.0:8000</text><rect x="602" y="278" width="334" height="130" rx="10" fill="white" stroke="#a4bbce"/><text x="626" y="317" font-size="23" font-weight="700">redis</text><text x="626" y="351" font-size="18">服务名 redis:6379</text><text x="626" y="383" font-size="18">不发布宿主机端口</text><path d="M500 177V196H390V265" stroke="#2f648c" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M414 343H590" stroke="#2f648c" stroke-width="3" marker-end="url(#a)"/><text x="440" y="326" font-size="16">Redis 协议</text><text x="440" y="373" font-size="16">服务名解析</text><rect x="602" y="499" width="334" height="83" rx="10" fill="white" stroke="#a4bbce"/><text x="626" y="530" font-size="20" font-weight="700">redis_data 命名卷</text><text x="626" y="559" font-size="17">挂载 /data · 保存 AOF 文件</text><path d="M769 408V487" stroke="#2f648c" stroke-width="3" marker-end="url(#a)"/><text x="58" y="515" font-size="18">外部请求走发布入口</text><text x="58" y="546" font-size="18">服务间通信走内部网络</text><text x="58" y="577" font-size="18">数据跨容器重建保留</text></g></svg>
