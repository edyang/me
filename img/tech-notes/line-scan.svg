<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">线扫成像需要相对运动</title><desc id="desc">一条线逐次采样，按运动关系形成二维图像</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376485"/></marker></defs><rect width="960" height="540" rx="12" fill="#fff"/><g font-family="system-ui,-apple-system,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="48" y="62" font-size="30" font-weight="700" fill="#22374a">线扫成像需要相对运动</text><text x="48" y="96" font-size="16" fill="#64798d">一条线逐次采样，按运动关系形成二维图像</text><rect x="45" y="190" width="235" height="105" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="162.5" y="226" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">线阵传感器</text><text x="162.5" y="256" text-anchor="middle" font-size="16" fill="#62788d">每次采集一条线</text><rect x="365" y="190" width="235" height="105" rx="12" fill="#f2f6fb" stroke="#bacddd"/><text x="482.5" y="226" text-anchor="middle" font-size="23" font-weight="650" fill="#244d6d">目标相对运动</text><text x="482.5" y="256" text-anchor="middle" font-size="16" fill="#62788d">平移或旋转</text><path d="M280 240L365 240" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="680" y="165" width="230" height="205" fill="#f2f6fb" stroke="#bacddd"/><line x1="690" y1="175" x2="690" y2="335" stroke="#376485" stroke-width="3"/><line x1="703" y1="175" x2="703" y2="335" stroke="#376485" stroke-width="3"/><line x1="716" y1="175" x2="716" y2="335" stroke="#376485" stroke-width="3"/><line x1="729" y1="175" x2="729" y2="335" stroke="#376485" stroke-width="3"/><line x1="742" y1="175" x2="742" y2="335" stroke="#376485" stroke-width="3"/><line x1="755" y1="175" x2="755" y2="335" stroke="#376485" stroke-width="3"/><line x1="768" y1="175" x2="768" y2="335" stroke="#376485" stroke-width="3"/><line x1="781" y1="175" x2="781" y2="335" stroke="#376485" stroke-width="3"/><line x1="794" y1="175" x2="794" y2="335" stroke="#376485" stroke-width="3"/><line x1="807" y1="175" x2="807" y2="335" stroke="#376485" stroke-width="3"/><line x1="820" y1="175" x2="820" y2="335" stroke="#376485" stroke-width="3"/><line x1="833" y1="175" x2="833" y2="335" stroke="#376485" stroke-width="3"/><line x1="846" y1="175" x2="846" y2="335" stroke="#376485" stroke-width="3"/><line x1="859" y1="175" x2="859" y2="335" stroke="#376485" stroke-width="3"/><line x1="872" y1="175" x2="872" y2="335" stroke="#376485" stroke-width="3"/><line x1="885" y1="175" x2="885" y2="335" stroke="#376485" stroke-width="3"/><text x="795" y="410" text-anchor="middle" font-size="23" fill="#244d6d">连续采样形成图像</text><path d="M600 240L680 240" stroke="#376485" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="60" y="430" font-size="18" fill="#62788d">运动方向比例由速度、行频和同步方式共同决定</text><text x="48" y="510" font-size="14" fill="#758799">通用原理示意 · 不含现场拓扑与生产参数</text></g></svg>
