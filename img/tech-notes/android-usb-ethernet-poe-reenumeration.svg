<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">USB-C 供电联网的分层排障</title><desc id="desc">区分供电、USB 识别、驱动注册和网络业务，PoE 重上电影响范围需实测。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#536b87"/></marker></defs><rect width="1200" height="850" fill="#f3f6fa"/><text x="45" y="53" font-family="sans-serif" font-size="32" fill="#20334e">Missing Ethernet after reboot: locate the failed stage</text><text x="45" y="88" font-family="sans-serif" font-size="21" fill="#20334e">Power OK does not imply USB enumeration or application readiness</text><rect x="45" y="125" width="290" height="94" rx="12" fill="#fff" stroke="#bdccdc"/><text x="63" y="160" font-family="sans-serif" font-size="23" fill="#20334e">PoE switch</text><text x="63" y="191" font-family="sans-serif" font-size="18" fill="#20334e">Per-port power / link control</text><rect x="445" y="125" width="300" height="94" rx="12" fill="#fff" stroke="#bdccdc"/><text x="463" y="160" font-family="sans-serif" font-size="23" fill="#20334e">PoE to USB-C adapter</text><text x="463" y="191" font-family="sans-serif" font-size="18" fill="#20334e">Power, attach, hub / Ethernet</text><rect x="850" y="125" width="305" height="94" rx="12" fill="#fff" stroke="#bdccdc"/><text x="868" y="160" font-family="sans-serif" font-size="23" fill="#20334e">Android tablet</text><text x="868" y="191" font-family="sans-serif" font-size="18" fill="#20334e">Data host role and network stack</text><path d="M335 172L445 172" stroke="#536b87" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 172L850 172" stroke="#536b87" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="150" font-family="sans-serif" font-size="18" fill="#20334e">PoE</text><text x="763" y="150" font-family="sans-serif" font-size="18" fill="#20334e">USB-C</text><rect x="45" y="246" width="1110" height="65" rx="10" fill="#fff1d6"/><text x="65" y="273" font-family="sans-serif" font-size="21" fill="#20334e">Observed: reboot loses interface; USB-C reconnect or PoE power cycle restores it</text><text x="65" y="298" font-family="sans-serif" font-size="18" fill="#20334e">Boundary: upstream actions affect power and link; root cause remains unconfirmed</text><rect x="45" y="355" width="520" height="90" rx="12" fill="#fff" stroke="#bdccdc"/><text x="63" y="390" font-family="sans-serif" font-size="23" fill="#20334e">1  USB device visible?</text><text x="63" y="421" font-family="sans-serif" font-size="18" fill="#20334e">No: inspect attach, data role and boot timing</text><rect x="635" y="355" width="520" height="90" rx="12" fill="#fff" stroke="#bdccdc"/><text x="653" y="390" font-family="sans-serif" font-size="23" fill="#20334e">2  Network interface registered?</text><text x="653" y="421" font-family="sans-serif" font-size="18" fill="#20334e">No: inspect driver binding and initialization</text><path d="M565 400L635 400" stroke="#536b87" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="495" width="520" height="90" rx="12" fill="#fff" stroke="#bdccdc"/><text x="653" y="530" font-family="sans-serif" font-size="23" fill="#20334e">3  Link and address ready?</text><text x="653" y="561" font-family="sans-serif" font-size="18" fill="#20334e">No: inspect carrier, DHCP and routes</text><path d="M895 445L895 495" stroke="#536b87" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="495" width="520" height="90" rx="12" fill="#fff" stroke="#bdccdc"/><text x="63" y="530" font-family="sans-serif" font-size="23" fill="#20334e">4  Application recovered?</text><text x="63" y="561" font-family="sans-serif" font-size="18" fill="#20334e">No: inspect DNS, authentication and server</text><path d="M635 540L565 540" stroke="#536b87" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="635" width="1110" height="160" rx="12" fill="#e5effc"/><text x="65" y="674" font-family="sans-serif" font-size="25" fill="#20334e">Automatic reset: proposed, not validated</text><text x="65" y="711" font-family="sans-serif" font-size="20" fill="#20334e">Idle + independent control + retry budget + cooldown -> allow per-port reset</text><text x="65" y="750" font-family="sans-serif" font-size="20" fill="#20334e">Verify: USB enumeration -> interface -> link / address -> application</text><text x="65" y="778" font-family="sans-serif" font-size="19" fill="#20334e">Unknown state: inhibit reset. Keep failure evidence. Avoid switch-wide disruption.</text></svg>