<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Spring AOP 学习：同类内部调用为何绕过事务</title>
<desc id="desc">外部调用：取得容器管理的入口；代理拦截：应用已配置的切面；目标方法：执行真实业务代码；内部调用：this 调用不重过代理</desc>
