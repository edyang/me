<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">裁剪上下文与有效检测区</title><desc id="desc">扩展输入后，结果只回写中央有效区域</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376485"/></marker></defs><rect width="960" height="540" rx="12" fill="#fff"/><g font-family="system-ui,-apple-system,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif"><text x="48" y="62" font-size="30" font-weight="700" fill="#22374a">裁剪上下文与有效检测区</text><text x="48" y="96" font-size="16" fill="#64798d">扩展输入后，结果只回写中央有效区域</text><rect x="150" y="135" width="500" height="300" rx="8" fill="#eef4fa" stroke="#547c9d" stroke-width="2"/><rect x="240" y="195" width="320" height="180" rx="5" fill="#fff" stroke="#244d6d" stroke-width="3"/><text x="400" y="283" text-anchor="middle" font-size="28" fill="#244d6d">中央有效区</text><text x="400" y="320" text-anchor="middle" font-size="17" fill="#62788d">映射回原图，避免重复计数</text><text x="400" y="166" text-anchor="middle" font-size="21" fill="#547c9d">外围上下文参与特征计算</text><text x="695" y="260" font-size="20" fill="#244d6d">需要验证</text><text x="695" y="298" font-size="18" fill="#62788d">边界缺陷</text><text x="695" y="331" font-size="18" fill="#62788d">回写坐标</text><text x="695" y="364" font-size="18" fill="#62788d">重叠合并</text><text x="48" y="510" font-size="14" fill="#758799">通用原理示意 · 不含现场拓扑与生产参数</text></g></svg>
