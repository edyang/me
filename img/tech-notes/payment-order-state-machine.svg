<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">大型支付系统学习：订单状态不能只靠一个成功标记</title>
<desc id="desc">业务订单：表达购买与应付金额；支付尝试：记录每一次外部请求；通道证据：通知与主动查询结合；状态迁移：按前置状态条件更新</desc>
