name: Content and Jekyll validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Validate notes and privacy checks
        run: python scripts/validate_tech_notes.py
      - name: Build Jekyll with GitHub Pages dependencies
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate rendered pages, dates, RSS and images
        run: python scripts/validate_tech_notes.py --site _site

